name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subzero
          POSTGRES_PASSWORD: subzero
          POSTGRES_DB: subzero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subzero -d subzero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://subzero:subzero@localhost:5432/subzero
      TEST_DATABASE_URL: postgres://subzero:subzero@localhost:5432/subzero_test
      BETTER_AUTH_SECRET: ci-secret-change-me-32-chars-minimum
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: "Brightloop Billing <billing@brightloop.test>"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: schema drift
        run: |
          pnpm db:generate
          git diff --exit-code drizzle/
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "drizzle/ has untracked or changed files; commit the generated migration."
            git status --porcelain drizzle/
            exit 1
          fi
      - name: state-machine guard
        run: bash scripts/check-status-writes.sh
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
